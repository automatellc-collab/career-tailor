<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Mr. V seal: Reputation Built On Quality">
  <!-- Seal mark. Swap for the company's real mascot vector (from their wrap vendor) if preferred. -->
  <style>
    .ring { transform-origin: 100px 100px; animation: spin 24s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .ring { animation: none; } }
  </style>
  <defs><path id="c" d="M100 100m-74 0a74 74 0 1 1 148 0a74 74 0 1 1 -148 0"/></defs>
  <circle cx="100" cy="100" r="98" fill="#D2202F"/>
  <g class="ring">
    <text font-family="Inter, Arial, sans-serif" font-weight="700" font-size="15" letter-spacing="4.2" fill="#fff">
      <textPath href="#c">REPUTATION BUILT ON QUALITY • MR. V •</textPath>
    </text>
  </g>
  <circle cx="100" cy="100" r="54" fill="#111114"/>
  <path d="M76 80l24 44 24-44" fill="none" stroke="#fff" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
